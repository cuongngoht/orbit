# The Docker benchmark's conformance tier (benchmark/README.md, ADR 0046, 0047, 0048). The fast tier -- every
# test/benchmark-*.test.mjs: case schemas, reference models, verifier and candidate controls through a Docker double,
# the scripted host over Orbit's real CLIs, the tables, the metrics -- already runs in ci.yml on every push, inside the
# definition of done's `node --test`, with no Docker and no network.
#
#   conformance   every case's verifier and judge controls in real containers -- a QA case's as whole runs its scripted
#                 hosts carry -- then scripted hosts through Orbit's own engineering loop and Orbit's own goal entry -- no
#                 model, no credential, no network for the host. On a pull request that touches the benchmark, and when a
#                 person asks for it.
#
# A REAL coding host never runs here: a model-carried run -- one case with --repair, a suite, or the autonomous ship
# (skills/orbit-release/ship.mjs, ADR 0049) -- runs in a Claude Code cloud session a person starts, where its credential
# is an environment variable of that session (CLAUDE.md, "Shipping a release from Claude Code cloud"). A scripted host's
# result is conformance of the controller and is never reported as a real host's.
#
# Every run's evidence -- report.md and report.json, a control run's controls.json, the metrics -- is uploaded, PASS or
# not: what a run did is read from its own records, never from this workflow's word.
name: benchmark

on:
  pull_request:
    paths:
      - "benchmark/**"
      - "test/benchmark-*"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

# Runs are kept in the default machine store, ~/.orbit/projects/ -- never inside the checkout.
jobs:
  # Every case of a suite held to its own controls in the verifier's containers: a planted fault and the partial fixes
  # FAIL, the clean source (or the solved fixture) PASSes, and every way of cheating the judge is refused by name.
  # A QA case's controls are whole runs, each carried by one of its scripted hosts (reference, idle, false-alarm) in the
  # controller's own process: the application on its isolated sandbox through Orbit's engine, its tests in the QA worker
  # -- no model and no credential (the engine is handed none), only the QA worker image and the time those runs take.
  # A QA case that plants calls the relay refuses (orbit-tools, 0.5.0) adds the hosts that send them: one that recovers,
  # one that repeats a refused call past the case's bound, one that never corrects one.
  # A sessions case's controls (ADR 0054) are whole runs the same way, each two sessions over one checkout: the second
  # carried by the control's own scripted host (reference, idle, cheat, half, and the ones that trust a poison).
  # An activation case's controls (0.5.0) are whole runs too: a seed round, a scripted host delivering every hook to
  # Orbit's own entry points in the runner container with no network, the inspection, and an outcome case's hidden checks
  # -- the runner image and the time those runs take.
  controls:
    strategy:
      fail-fast: false
      matrix:
        suite: [orbit-source, orbit-governance, orbit-memory, orbit-improvement, orbit-orchestration, orbit-satellite, orbit-verdicts, orbit-engineering, orbit-heldout, orbit-qa, orbit-sessions, orbit-activation, orbit-workflow, orbit-missions, orbit-tools]
        include:
          - suite: orbit-qa
            images: --qa-worker
            minutes: 360
          - suite: orbit-tools
            images: --qa-worker
            minutes: 240
          - suite: orbit-sessions
            images: --qa-worker
            minutes: 360
          - suite: orbit-activation
            images: --runner
            minutes: 360
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes || 240 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: docker answers
        run: docker version
      - name: the images its controls need
        run: node benchmark/run.mjs build --verifier ${{ matrix.images }}
      - name: every case's verifier and judge controls
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          status=0
          for c in $(node -e "for (const id of JSON.parse(require('fs').readFileSync('benchmark/suites/' + process.env.SUITE + '/suite.json', 'utf8')).cases) console.log(id)"); do
            node benchmark/run.mjs controls "$c" --skip-engine || status=1
          done
          exit $status
      - name: the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controls-${{ matrix.suite }}
          path: ~/.orbit/projects/**/benchmark/**/controls.json
          if-no-files-found: ignore

  # Scripted hosts in the runner container, through Orbit's real loops and no model: a reference repair of a known finding
  # through the engineering loop, a goal through the goal entry to a verified change -- on the tuned fixture and on the
  # held-out one (ADR 0056) -- a goal with no rule refused, an interrupted session carried on its own task, and a request
  # through /orbit-help with every control of its case. Each is held to the outcome it declares (and a workflow control
  # to the legs it names).
  scripted:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: docker answers
        run: docker version
      - name: the verifier and runner images
        run: node benchmark/run.mjs build --verifier --runner
      - name: a scripted repair through Orbit's engineering loop
        run: node benchmark/run.mjs controls ORBIT-SRC-002 --only=reference-engine
      - name: a scripted goal through Orbit's goal entry
        run: node benchmark/run.mjs controls ORBIT-E2E-001 --only=reference
      - name: a goal that leaves out its rule, refused and not invented
        run: node benchmark/run.mjs controls ORBIT-E2E-008 --only=blocked
      - name: a held-out goal through Orbit's goal entry, on the application nobody tuned Orbit against (ADR 0056)
        run: node benchmark/run.mjs controls ORBIT-HLD-001 --only=reference
      - name: an interrupted session, reconciled on its own task
        run: node benchmark/run.mjs controls ORBIT-E2E-007 --only=interrupted
      # 0.5.0 (B1, ADR 0053): one request through /orbit-help -- the reference must PASS on every leg, code-only must fail
      # on the QA leg, bypass on the path leg, idle make no progress.
      - name: a request through /orbit-help, held to its code, its QA step and its path
        run: node benchmark/run.mjs controls ORBIT-WF-004
      # 0.5.0 (B4, ADR 0055): a goal through Orbit Satellite -- the reference must PASS on every leg, half the change fail
      # on the code leg, a claim no owner's record backs on the code and the criteria, a reader outside its profile on the
      # privilege leg, idle make no progress.
      - name: a bug with its verification through Satellite, held to its code, its criteria and its privilege
        run: node benchmark/run.mjs controls ORBIT-MSN-001
      - name: a small feature through Satellite, held to the same three legs
        run: node benchmark/run.mjs controls ORBIT-MSN-002
      - name: the metrics, apart by host basis
        if: always()
        run: node benchmark/run.mjs metrics --json > "$RUNNER_TEMP/metrics.json" || true
      - name: the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted
          path: |
            ~/.orbit/projects/**/benchmark/**/report.md
            ~/.orbit/projects/**/benchmark/**/report.json
            ~/.orbit/projects/**/benchmark/**/controls.json
            ~/.orbit/projects/**/benchmark/**/verified.json
            ${{ runner.temp }}/metrics.json
          if-no-files-found: ignore
