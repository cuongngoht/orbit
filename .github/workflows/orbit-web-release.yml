# Orbit Web release -- a SCOPED exception to "no GitHub workflow" (ADR 0060). It publishes the image to GHCR only when
# a person starts it by hand, from main, with the version that integrations/orbit-web/package.json holds, and only after
# a reviewer of the `orbit-web-release` environment approves it (configure that environment's required reviewers in
# the repository's settings before the first release). It moves `latest` only when asked to. It records the immutable
# digest and writes the release notes from CHANGELOG.md. It never pushes to a branch.
name: Orbit Web release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The Orbit Web version to publish (must equal integrations/orbit-web/package.json)"
        required: true
        type: string
      latest:
        description: "Also point ghcr.io/<owner>/orbit-web:latest at this release"
        required: false
        type: boolean
        default: false
      arm64:
        description: "Also build linux/arm64 (needs GitHub's ubuntu-24.04-arm runners)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orbit-web-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orbit-web
  VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Verify the version and every check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: The version asked is the version in the tree, and the changelog has it
        run: node integrations/orbit-web/scripts/release.mjs verify --version="$VERSION"
      - name: Orbit Web checks
        run: node integrations/orbit-web/scripts/ci.mjs
      - name: Orbit's own suite and lint
        run: |
          node --test
          node cli/check-five-lines.mjs src cli skills --strict
      - id: matrix
        name: Which architectures
        env:
          ARM64: ${{ inputs.arm64 }}
        run: |
          if [ "$ARM64" = "true" ]; then
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, smoke test and push (${{ matrix.arch }})
    needs: verify
    strategy:
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: orbit-web-release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      amd64: ${{ steps.push.outputs.amd64 }}
      arm64: ${{ steps.push.outputs.arm64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Build
        run: node integrations/orbit-web/scripts/build-image.mjs --tag="$IMAGE:$VERSION-${{ matrix.arch }}"
      - name: Smoke test
        run: node integrations/orbit-web/tests/docker/smoke.mjs --image="$IMAGE:$VERSION-${{ matrix.arch }}"
      - id: push
        name: Push and record the digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION-${{ matrix.arch }}")
          echo "${{ matrix.arch }}=$digest" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.arch }}: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Tag the release and write its notes
    needs: build
    runs-on: ubuntu-24.04
    environment: orbit-web-release
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: One manifest for every architecture built
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          AMD64: ${{ needs.build.outputs.amd64 }}
          ARM64: ${{ needs.build.outputs.arm64 }}
          LATEST: ${{ inputs.latest }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" $AMD64 $ARM64
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE:$VERSION@$digest\`$([ "$LATEST" = "true" ] && echo ' (also latest)')" >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes and the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          LATEST: ${{ inputs.latest }}
        run: |
          node integrations/orbit-web/scripts/release.mjs notes --version="$VERSION" --image="$IMAGE" --digest="$DIGEST" --commit="$GITHUB_SHA" --latest="$LATEST" > notes.md
          gh release create "orbit-web-v$VERSION" --target "$GITHUB_SHA" --title "Orbit Web $VERSION" --notes-file notes.md
