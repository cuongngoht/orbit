# Orbit Web release -- a SCOPED exception to "no GitHub workflow" (ADR 0060). It publishes Orbit Web's four images to
# GHCR -- Orbit Web itself and the three an AI employee's attempt is started from (workstation, model-plane,
# storage-helper), under one tag -- only when a person starts it by hand, from main, with the version that
# integrations/orbit-web/package.json holds (and every compose file names), and only after a reviewer of the
# `orbit-web-release` environment approves it (configure that environment's required reviewers in the repository's
# settings before the first release). It moves `latest` only when asked to. It records each image's immutable digest and
# writes the release notes from CHANGELOG.md. It never pushes to a branch.
name: Orbit Web release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The Orbit Web version to publish (must equal integrations/orbit-web/package.json)"
        required: true
        type: string
      latest:
        description: "Also point the four images' latest tag at this release"
        required: false
        type: boolean
        default: false
      arm64:
        description: "Also build linux/arm64 (GitHub's ubuntu-24.04-arm runners); docker/compose.published.yaml says both are published"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: orbit-web-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Verify the version and every check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: The version asked is the version in the tree and of every image it names, and the changelog has it
        run: node integrations/orbit-web/scripts/release.mjs verify --version="$VERSION"
      - name: Orbit Web checks
        run: node integrations/orbit-web/scripts/ci.mjs
      - name: Orbit's own suite and lint
        run: |
          node --test
          node cli/check-five-lines.mjs src cli skills --strict
      - id: matrix
        name: Which architectures
        env:
          ARM64: ${{ inputs.arm64 }}
        run: |
          if [ "$ARM64" = "true" ]; then
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, smoke test and push the four images (${{ matrix.arch }})
    needs: verify
    strategy:
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: orbit-web-release
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      amd64: ${{ steps.push.outputs.amd64 }}
      arm64: ${{ steps.push.outputs.arm64 }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Room for four images (the runner's preinstalled toolchains are not used here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build Orbit Web
        run: node integrations/orbit-web/scripts/build-image.mjs --tag="$REGISTRY/orbit-web:$VERSION-$ARCH"
      - name: Smoke test
        run: node integrations/orbit-web/tests/docker/smoke.mjs --image="$REGISTRY/orbit-web:$VERSION-$ARCH"
      - name: Build the AI employees' three images (the same Dockerfile's targets)
        run: |
          for target in workstation model-plane storage-helper; do
            node integrations/orbit-web/scripts/build-image.mjs --target="$target" --tag="$REGISTRY/orbit-web-$target:$VERSION-$ARCH"
          done
      - id: push
        name: Push the four and record their digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          refs=()
          for name in orbit-web orbit-web-workstation orbit-web-model-plane orbit-web-storage-helper; do
            docker push "$REGISTRY/$name:$VERSION-$ARCH"
            ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REGISTRY/$name:$VERSION-$ARCH" | grep -m1 "^$REGISTRY/$name@sha256:")
            if [ -z "$ref" ]; then echo "no digest for $REGISTRY/$name:$VERSION-$ARCH after its push" >&2; exit 1; fi
            refs+=("$name=$ref")
            echo "$ARCH $name: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$ARCH=${refs[*]}" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag the four images and write the release's notes
    needs: build
    runs-on: ubuntu-24.04
    environment: orbit-web-release
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: One manifest per image, for every architecture built
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          AMD64: ${{ needs.build.outputs.amd64 }}
          ARM64: ${{ needs.build.outputs.arm64 }}
          LATEST: ${{ inputs.latest }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          digests=()
          for name in orbit-web orbit-web-workstation orbit-web-model-plane orbit-web-storage-helper; do
            sources=()
            for pair in $AMD64 $ARM64; do
              if [ "${pair%%=*}" = "$name" ]; then sources+=("${pair#*=}"); fi
            done
            if [ "${#sources[@]}" -eq 0 ]; then echo "no architecture of $name was built" >&2; exit 1; fi
            tags=(-t "$REGISTRY/$name:$VERSION")
            if [ "$LATEST" = "true" ]; then tags+=(-t "$REGISTRY/$name:latest"); fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            digest=$(docker buildx imagetools inspect "$REGISTRY/$name:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            digests+=("$name=$digest")
            echo "Published \`$REGISTRY/$name:$VERSION@$digest\`$([ "$LATEST" = "true" ] && echo ' (also latest)')" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "digests=$(IFS=,; echo "${digests[*]}")" >> "$GITHUB_OUTPUT"
      - name: Release notes and the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ steps.manifest.outputs.digests }}
          LATEST: ${{ inputs.latest }}
        run: |
          node integrations/orbit-web/scripts/release.mjs notes --version="$VERSION" --registry="$REGISTRY" --repository="$GITHUB_REPOSITORY" --commit="$GITHUB_SHA" --digests="$DIGESTS" --latest="$LATEST" > notes.md
          gh release create "orbit-web-v$VERSION" --target "$GITHUB_SHA" --title "Orbit Web $VERSION" --notes-file notes.md
