# RELEASE QUALIFICATION (ADR 0049): the autonomous ship, run as a person dispatches it -- never on a push or a pull
# request. `node skills/orbit-release/ship.mjs` runs here exactly as on a workstation: its preflight; a fresh release
# artifact and fresh benchmark images; every case of every suite in Docker; every model-carried row by the real Claude
# Code CLI in the benchmark's runner, its credential named from the `benchmark` environment and never printed; a
# repairable source defect repaired through the benchmark's own repair path and integrated only in the ship's own
# workspace; and the whole catalog run again on the result. Then the publish gate (`ship.mjs --evidence`) says whether
# the commit this workflow checked out is the one that qualified -- when repairs were integrated, it is not until a
# person applies the release patch.
#
# It never tags, pushes or publishes: a release is a person's act, once the evidence holds. Every ship's room is
# uploaded, SHIPPABLE or not -- its manifest, its steps, its ending, its evidence.json, the release patch and bundle
# when repairs await a person, the artifact -- and every benchmark run's report, read from their own records, never
# from this workflow's word. A green ci.yml is never release qualification; this is.
#
# A full ship runs for hours: a GitHub-hosted runner stops a job at six, so a ship that needs longer runs on a
# self-hosted runner with Docker (`runner` names its label) -- or on a workstation, where `--resume` carries it on.
name: release

on:
  workflow_dispatch:
    inputs:
      repair:
        description: "repair what a case declares repairable (true), or verify only (false)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      usd:
        description: "the most the ship may spend over every model-carried row, in USD (within the release policy's bounds)"
        required: false
        default: "400"
      minutes:
        description: "the ship's wall-time limit, in minutes (within the release policy's bounds)"
        required: false
        default: "2880"
      model:
        description: "a model id for the coding host, or nothing for its own default"
        required: false
        default: ""
      runner:
        description: "the runner: ubuntu-latest (six hours at most), or a self-hosted label with Docker"
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 4320
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: docker answers
        run: docker version
      # The inputs reach the shell as environment, are checked as plain values, and are never spliced into the script;
      # the credential is named to the ship, which hands it to the runner by name -- never printed.
      - name: the autonomous ship
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPAIR: ${{ inputs.repair }}
          USD: ${{ inputs.usd }}
          MINUTES: ${{ inputs.minutes }}
          MODEL: ${{ inputs.model }}
        run: |
          case "$REPAIR" in true|false) ;; *) echo "repair is true or false"; exit 2;; esac
          case "$USD" in ''|*[!0-9.]*) echo "usd is a number"; exit 2;; esac
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes is a whole number"; exit 2;; esac
          case "$MODEL" in *[!A-Za-z0-9._-]*) echo "a model id is letters, digits, dots and dashes"; exit 2;; esac
          args=("--usd=$USD" "--minutes=$MINUTES")
          if [ "$REPAIR" = "false" ]; then args+=(--no-repair); fi
          if [ -n "$MODEL" ]; then args+=("--model=$MODEL"); fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then args+=(--credential=CLAUDE_CODE_OAUTH_TOKEN); fi
          node skills/orbit-release/ship.mjs "${args[@]}"
      # Said for the reader; a release is published only by a person, and only once this says PUBLISHABLE.
      - name: the publish gate, for the commit checked out
        if: always()
        run: node skills/orbit-release/ship.mjs --evidence || true
      - name: the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification
          path: |
            ~/.orbit/projects/**/release/**/manifest.json
            ~/.orbit/projects/**/release/**/ending.json
            ~/.orbit/projects/**/release/**/evidence.json
            ~/.orbit/projects/**/release/**/steps/*.json
            ~/.orbit/projects/**/release/**/release.patch
            ~/.orbit/projects/**/release/**/release.bundle
            ~/.orbit/projects/**/release/**/artifacts/*.zip
            ~/.orbit/projects/**/benchmark/**/report.md
            ~/.orbit/projects/**/benchmark/**/report.json
            ~/.orbit/projects/**/benchmark/**/verified.json
            ~/.orbit/projects/**/benchmark/**/rounds/*/candidate.patch
          if-no-files-found: ignore
