# Stack A of the synthetic invoice application: PostgreSQL, an AMQP 0-9-1 broker and the
# application -- ONE image running every role under its own supervisor (app/main.mjs). Images
# are pinned by digest, and every environment value is a literal. The ports are published on
# loopback only, for a person (or the smoke) on this machine; on the compose network the names
# are db, broker and invoice-app.
name: invoice-a

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: invoice
      POSTGRES_DB: invoice
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "invoice", "-d", "invoice"]
      interval: 2s
      timeout: 3s
      retries: 30

  broker:
    image: rabbitmq:4@sha256:71be6ca71cd3ad92f29b354ec381b1ee587894aaaac21f185b8cf43fb50d3feb
    environment:
      RABBITMQ_DEFAULT_USER: invoice
      RABBITMQ_DEFAULT_PASS: invoice-pass
    ports:
      - "127.0.0.1:${INVOICE_BROKER_PORT:-35672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  invoice-app:
    build: .
    init: true
    environment:
      # the broker's synthetic credential, the same literal the broker service is given
      AMQP_USER: invoice
      AMQP_PASSWORD: invoice-pass
      # per-run secrets: the sink refuses to start without ORBIT_SINK_TOKEN (16+ characters), and
      # the test hooks exist only with ORBIT_TEST_HOOKS=on AND an ORBIT_TEST_HOOKS_TOKEN
      ORBIT_SINK_TOKEN: "${ORBIT_SINK_TOKEN:-}"
      ORBIT_TEST_HOOKS: "${ORBIT_TEST_HOOKS:-off}"
      ORBIT_TEST_HOOKS_TOKEN: "${ORBIT_TEST_HOOKS_TOKEN:-}"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INVOICE_API_PORT:-38080}:8080"
      - "127.0.0.1:${INVOICE_SINK_PORT:-38081}:8081"
      - "127.0.0.1:${INVOICE_HOOKS_PORT:-39090}:9090"
