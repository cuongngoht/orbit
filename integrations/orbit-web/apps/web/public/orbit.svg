<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="orbit-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c69db" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#5b58d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#5b58d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbit-core" cx="35%" cy="29%" r="72%" fx="33%" fy="26%">
      <stop offset="0%" stop-color="#e3e2ff" />
      <stop offset="22%" stop-color="#8b88ea" />
      <stop offset="56%" stop-color="#4e4ac9" />
      <stop offset="86%" stop-color="#2e2a8c" />
      <stop offset="100%" stop-color="#1d1a5e" />
    </radialGradient>

    <radialGradient id="orbit-rim" cx="74%" cy="78%" r="54%">
      <stop offset="0%" stop-color="#b9b7ff" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#7d7ae1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#7d7ae1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="orbit-core-stroke" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#8f8de7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c9c8f6" stop-opacity="0.38" />
    </linearGradient>

    <linearGradient id="orbit-back-arc" x1="5" y1="32" x2="59" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b58d4" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#3633a0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6c69db" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="orbit-front-ribbon" x1="4.4" y1="36" x2="59.6" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4541be" />
      <stop offset="24%" stop-color="#6c69db" />
      <stop offset="50%" stop-color="#dddcfb" />
      <stop offset="76%" stop-color="#6965d9" />
      <stop offset="100%" stop-color="#3e3ab5" />
    </linearGradient>

    <linearGradient id="orbit-front-sheen" x1="12" y1="39" x2="52" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbit-secondary" x1="10" y1="22" x2="54" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c69db" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8f8de7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#5b58d4" stop-opacity="0.28" />
    </linearGradient>

    <radialGradient id="orbit-sat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c69db" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6c69db" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbit-sat-core" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#b8b6f7" />
      <stop offset="100%" stop-color="#4b48c9" />
    </radialGradient>

    <clipPath id="orbit-core-clip">
      <circle cx="32" cy="32" r="13.5" />
    </clipPath>
  </defs>

  <!-- Soft atmospheric aura -->
  <circle cx="32" cy="32" r="24" fill="url(#orbit-glow)" />

  <!-- Subtle secondary precision orbital inclination -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#orbit-secondary)" stroke-width="1.25" transform="rotate(28 32 32)" />

  <!-- Back half of primary orbit (occluded behind sphere) -->
  <g transform="rotate(-26 32 32)">
    <path d="M 5.5 32 A 26.5 10.05 0 0 1 58.5 32" stroke="url(#orbit-back-arc)" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- 3D dimensional central sphere -->
  <circle cx="32" cy="32" r="13.5" fill="url(#orbit-core)" />
  <circle cx="32" cy="32" r="13.5" fill="url(#orbit-rim)" />
  <circle cx="32" cy="32" r="13.05" stroke="url(#orbit-core-stroke)" stroke-width="0.9" />

  <!-- Physical cast shadow of front orbital ribbon onto lower hemisphere -->
  <g clip-path="url(#orbit-core-clip)">
    <g transform="rotate(-26 32 32)">
      <path d="M 4.4 33.8 A 27.6 11.9 0 0 0 59.6 33.8" stroke="#0d0b2e" stroke-opacity="0.34" stroke-width="3.6" />
    </g>
  </g>

  <!-- Sculpted variable-width front orbital ribbon (sweeps over sphere) -->
  <g transform="rotate(-26 32 32)">
    <path d="M 4.4 32 A 27.6 11.9 0 0 0 59.6 32 A 1.1 1.1 0 0 0 57.4 32 A 25.4 8.2 0 0 1 6.6 32 A 1.1 1.1 0 0 0 4.4 32 Z" fill="url(#orbit-front-ribbon)" />
    <path d="M 11 35.8 A 25.8 9.8 0 0 0 53 35.8" stroke="url(#orbit-front-sheen)" stroke-width="0.95" stroke-linecap="round" />

    <!-- Orbiting satellite node on upper-right track -->
    <circle cx="53.6" cy="26.2" r="6.8" fill="url(#orbit-sat-glow)" />
    <circle cx="53.6" cy="26.2" r="3.4" fill="url(#orbit-sat-core)" stroke="#403db8" stroke-opacity="0.45" stroke-width="0.6" />
    <circle cx="52.6" cy="25.2" r="1.1" fill="#ffffff" fill-opacity="0.9" />
  </g>
</svg>
