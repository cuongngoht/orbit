# Orbit Web, GOVERNED: the control plane and the coding agent in two containers of the same image.
#
#   cd integrations/orbit-web/docker && docker compose -f compose.governed.yaml up -d --build
#
#   postgres     PostgreSQL 17 with pgvector: every record Orbit Web keeps -- accounts, chats, research and governance's
#                records. On a network only the control plane joins: the agent's container cannot reach it, and holds
#                no credential of it. Never published on this machine. Its role for Orbit Web is made by
#                docker/postgres/init/10-orbit.sh (a login, never a superuser); set ORBIT_WEB_DB_PASSWORD and
#                ORBIT_WEB_POSTGRES_PASSWORD in a .env file beside this one before the first start.
#   orbit-web    the control plane: the API and the web app, the GitHub and Azure CLIs' sign-ins, the control plane's
#                own copies of the repositories, and the egress proxy -- the agent's only way out. Published on this
#                machine only.
#   orbit-agent  Claude Code and everything that touches a workspace, started through its runner. It has the Claude
#                account's configuration, the workspaces, the chats' sessions, Orbit's store and a home -- and none of
#                the rooms above: they are not mounted. Its network is internal: it reaches the control plane's gateway
#                and proxy, and nothing else. Its root file system is read-only.
#
# Both run as the same non-root user, with no capability and no Docker socket. The isolation is the mounts, the process
# namespace and the network -- which the agent cannot change -- not the user. Orbit Web checks it before every strict
# run (Governance → Overview says what was checked); a check the agent's container answers is a check of the wiring,
# not proof against a runner the agent has taken over (README, "The limit, said plainly").
#
# Every connection through the proxy is a decision of the policy of the account whose run it is (Governance → Policy):
# an account is given the strict default policy of this deployment when it first signs in.
#
#   orbit-allocator  AI employees' attempts, as in compose.yaml: the only holder of the Docker socket; two containers
#                    per attempt (model plane, tool plane) from fixed images, a fixed mount list and the employee's
#                    limits; the employees' storage with its quotas. On the private `control` network, answering Orbit
#                    Web alone (signed requests); no published port. Needs `allocator.secret` beside this file and the
#                    three employee images (see compose.yaml).
#
# A subscription connection is signed in from the operator's own terminal, with the unmodified official CLI:
#   docker compose -f compose.governed.yaml exec orbit-web node /opt/orbit-web/apps/api/dist/cli/connect.js <connectionId>
#
# The control plane (orbit-web, orbit-agent, postgres, orbit-allocator) runs within fixed limits (the *_CPUS, *_MEMORY,
# *_PIDS knobs below): what the host has beyond them, less a reserve for the OS, is what employees may use.
name: orbit-web-governed

x-hardened: &hardened
  image: ${ORBIT_WEB_IMAGE:-ghcr.io/cuongngoht/orbit-web:0.8.0}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-employees: &employees
  ORBIT_WEB_SANDBOX_PREFIX: orbit-web-governed
  ORBIT_WEB_SANDBOX_HOST: orbit-web
  ORBIT_WEB_ALLOCATOR_SECRET_FILE: /run/secrets/orbit-allocator

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORBIT_WEB_POSTGRES_PASSWORD:-orbit-postgres-local}
      POSTGRES_DB: postgres
      ORBIT_DB_PASSWORD: ${ORBIT_WEB_DB_PASSWORD:-orbit-local}
    volumes:
      - orbit-web-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    cpus: ${ORBIT_WEB_POSTGRES_CPUS:-0.5}
    mem_limit: ${ORBIT_WEB_POSTGRES_MEMORY:-768m}
    pids_limit: ${ORBIT_WEB_POSTGRES_PIDS:-256}
    restart: unless-stopped
    stop_grace_period: 30s

  orbit-web:
    <<: *hardened
    build:
      context: ../../..
      dockerfile: integrations/orbit-web/docker/Dockerfile
    hostname: orbit-web-control
    ports:
      - "127.0.0.1:${ORBIT_WEB_HOST_PORT:-3000}:3000"
    volumes:
      - orbit-web-data:/data
    environment:
      ORBIT_WEB_DEPLOYMENT: governed
      ORBIT_WEB_DATABASE_URL: postgres://orbit:${ORBIT_WEB_DB_PASSWORD:-orbit-local}@postgres:5432/orbit
      ORBIT_WEB_RUNNER: orbit-agent:7070
      ORBIT_WEB_AGENT_NETWORKS: ${ORBIT_WEB_AGENT_SUBNET:-172.31.250.0/24}
      ORBIT_WEB_AGENT_CONTROL_HOST: orbit-web
      ORBIT_WEB_EGRESS_PROXY_PORT: "3128"
      # A per-run spending cap for Claude Code, in US dollars (unset: no cap).
      ORBIT_WEB_MAX_BUDGET_USD: ${ORBIT_WEB_MAX_BUDGET_USD:-}
      # AI employees: every attempt in its own two containers, made by the allocator.
      <<: *employees
      ORBIT_WEB_SANDBOX: container
      ORBIT_WEB_ALLOCATOR_URL: http://orbit-allocator:7171
      ORBIT_WEB_ACCEPT_SOFT_STORAGE: ${ORBIT_WEB_ACCEPT_SOFT_STORAGE:-0}
      ORBIT_WEB_CAPACITY_CPU: ${ORBIT_WEB_CAPACITY_CPU:-}
      ORBIT_WEB_CAPACITY_MEMORY: ${ORBIT_WEB_CAPACITY_MEMORY:-}
      ORBIT_WEB_CAPACITY_STORAGE: ${ORBIT_WEB_CAPACITY_STORAGE:-}
      ORBIT_WEB_CAPACITY_RESERVE_CPU: ${ORBIT_WEB_CAPACITY_RESERVE_CPU:-}
      ORBIT_WEB_CAPACITY_RESERVE_MEMORY: ${ORBIT_WEB_CAPACITY_RESERVE_MEMORY:-}
      ORBIT_WEB_CAPACITY_RESERVE_STORAGE: ${ORBIT_WEB_CAPACITY_RESERVE_STORAGE:-}
      ORBIT_WEB_MODEL_PLANE_CLAUDE_CPU: ${ORBIT_WEB_MODEL_PLANE_CLAUDE_CPU:-}
      ORBIT_WEB_MODEL_PLANE_CLAUDE_MEMORY: ${ORBIT_WEB_MODEL_PLANE_CLAUDE_MEMORY:-}
      ORBIT_WEB_MODEL_PLANE_CODEX_CPU: ${ORBIT_WEB_MODEL_PLANE_CODEX_CPU:-}
      ORBIT_WEB_MODEL_PLANE_CODEX_MEMORY: ${ORBIT_WEB_MODEL_PLANE_CODEX_MEMORY:-}
      ORBIT_WEB_MODEL_PLANE_AGY_CPU: ${ORBIT_WEB_MODEL_PLANE_AGY_CPU:-}
      ORBIT_WEB_MODEL_PLANE_AGY_MEMORY: ${ORBIT_WEB_MODEL_PLANE_AGY_MEMORY:-}
      ORBIT_WEB_CONTROL_PLANE_LIMITS: "orbit-web:${ORBIT_WEB_CPUS:-1.0}:${ORBIT_WEB_MEMORY:-2g},orbit-agent:${ORBIT_WEB_AGENT_CPUS:-1.0}:${ORBIT_WEB_AGENT_MEMORY:-2g},postgres:${ORBIT_WEB_POSTGRES_CPUS:-0.5}:${ORBIT_WEB_POSTGRES_MEMORY:-768m},allocator:${ORBIT_WEB_ALLOCATOR_CPUS:-0.25}:${ORBIT_WEB_ALLOCATOR_MEMORY:-256m}"
    secrets:
      - orbit-allocator
    depends_on:
      postgres:
        condition: service_healthy
      orbit-allocator:
        condition: service_started
    networks:
      - default
      - agent
      - db
      - control
    cpus: ${ORBIT_WEB_CPUS:-1.0}
    mem_limit: ${ORBIT_WEB_MEMORY:-2g}
    pids_limit: ${ORBIT_WEB_PIDS:-2048}
    stop_grace_period: 20s

  orbit-agent:
    <<: *hardened
    command: ["node", "--disable-warning=ExperimentalWarning", "/opt/orbit-web/apps/api/dist/runner/main.js"]
    # Orbit's machine store names its runtime room after the host name: a fixed one keeps it across re-creations.
    hostname: orbit-agent
    working_dir: /data/home
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777,size=1g
    volumes:
      - { type: volume, source: orbit-web-data, target: /data/claude, volume: { subpath: claude } }
      - { type: volume, source: orbit-web-data, target: /data/workspaces, volume: { subpath: workspaces } }
      - { type: volume, source: orbit-web-data, target: /data/sessions, volume: { subpath: sessions } }
      - { type: volume, source: orbit-web-data, target: /data/orbit, volume: { subpath: orbit } }
      - { type: volume, source: orbit-web-data, target: /data/home, volume: { subpath: home } }
      # The control plane's copies of the repositories: what the workspaces are cloned and fetched from. Read-only.
      - { type: volume, source: orbit-web-data, target: /data/repos, read_only: true, volume: { subpath: repos } }
    networks:
      - agent
    # Names of this compose project still resolve (Docker's own resolver); a name on the internet does not.
    dns:
      - 127.0.0.1
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(7070,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      orbit-web:
        condition: service_healthy
    cpus: ${ORBIT_WEB_AGENT_CPUS:-1.0}
    mem_limit: ${ORBIT_WEB_AGENT_MEMORY:-2g}
    pids_limit: ${ORBIT_WEB_AGENT_PIDS:-2048}
    stop_grace_period: 20s

  orbit-allocator:
    <<: *hardened
    command: ["node", "--disable-warning=ExperimentalWarning", "/opt/orbit-web/apps/api/dist/allocator/main.js"]
    # Root with no capability: the socket is root's, and that is the whole of what it needs.
    user: "0:0"
    environment:
      <<: *employees
      ORBIT_WEB_DOCKER_SOCKET: /var/run/docker.sock
      ORBIT_WEB_ALLOCATOR_STATE_DIR: /var/lib/orbit-allocator
      ORBIT_WEB_SANDBOX_IMAGE_WORKSTATION: ${ORBIT_WEB_WORKSTATION_IMAGE:-ghcr.io/cuongngoht/orbit-web-workstation:0.8.0}
      ORBIT_WEB_SANDBOX_IMAGE_MODEL_PLANE: ${ORBIT_WEB_MODEL_PLANE_IMAGE:-ghcr.io/cuongngoht/orbit-web-model-plane:0.8.0}
      ORBIT_WEB_SANDBOX_IMAGE_STORAGE_HELPER: ${ORBIT_WEB_STORAGE_HELPER_IMAGE:-ghcr.io/cuongngoht/orbit-web-storage-helper:0.8.0}
      ORBIT_WEB_DATA_VOLUME: ${COMPOSE_PROJECT_NAME}_orbit-web-data
      # This project's Orbit Web container: connected to every attempt's two internal networks, their only other member.
      ORBIT_WEB_CONTROL_CONTAINER: ${COMPOSE_PROJECT_NAME}-orbit-web-1
      ORBIT_WEB_ATTEMPT_SUBNETS: ${ORBIT_WEB_ATTEMPT_SUBNETS:-}
      ORBIT_WEB_WORKFORCE_VOLUME: orbit-web-governed-workforce
      ORBIT_WEB_WORKFORCE_STORE_VOLUME: orbit-web-governed-workforce-store
      ORBIT_WEB_WORKFORCE_POOL_SIZE: ${ORBIT_WEB_WORKFORCE_POOL_SIZE:-20g}
      ORBIT_WEB_WORKFORCE_POOL_PREALLOCATE: ${ORBIT_WEB_WORKFORCE_POOL_PREALLOCATE:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orbit-web-allocator:/var/lib/orbit-allocator
    secrets:
      - orbit-allocator
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7171/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    cpus: ${ORBIT_WEB_ALLOCATOR_CPUS:-0.25}
    mem_limit: ${ORBIT_WEB_ALLOCATOR_MEMORY:-256m}
    pids_limit: ${ORBIT_WEB_ALLOCATOR_PIDS:-256}
    stop_grace_period: 20s

networks:
  # The database's network: internal, joined by the control plane and the database alone -- never by the agent.
  db:
    internal: true
  agent:
    internal: true
    ipam:
      config:
        - subnet: ${ORBIT_WEB_AGENT_SUBNET:-172.31.250.0/24}
  # Orbit Web and the allocator, alone.
  control:
    internal: true

secrets:
  orbit-allocator:
    file: ./allocator.secret

volumes:
  orbit-web-data:
  orbit-web-postgres:
  orbit-web-allocator:
