# A LOCALHOST-ONLY TRIAL of Orbit Web: an override of compose.yaml that turns trial mode on.
#
#   cd integrations/orbit-web/docker
#   docker compose -f compose.yaml -f compose.trial.yaml up -d --build
#   open http://localhost:3000          # sign in as admin / 123456, then change the password (Settings → Account)
#
# Trial mode (ORBIT_WEB_TRIAL=1) creates the account `admin` / `123456` once -- the one password that skips the password
# rules -- and shows it on the sign-in page and in a red bar on every page until it is changed. Because that password is
# public, Orbit Web REFUSES TO START in trial mode unless the installation can only be reached from this machine: host
# names on loopback only (ORBIT_WEB_ALLOWED_HOSTS unset), no access token, the single deployment, no public origin and
# no HTTPS cookie setting. This file publishes the port on 127.0.0.1 alone, whatever compose.yaml publishes.
#
# Never use it for anything another person can reach; a production installation never sets ORBIT_WEB_TRIAL. To keep
# using the trial with plain `docker compose …` commands, put `COMPOSE_FILE=compose.yaml:compose.trial.yaml` in `.env`.
services:
  orbit-web:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      ORBIT_WEB_TRIAL: "1"
