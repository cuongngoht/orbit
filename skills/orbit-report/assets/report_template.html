<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<meta name="description" content="Delivery, flow, review activity, backlog and forecast for one project over one window, from its own sources.">
<style>
{{{fonts}}}
:root{
  color-scheme:light;
  --ground:#f4f4ef; --surface:#fcfcfb; --surface-2:#efeee8; --ink:#15150f; --ink-2:#55544c; --ink-3:#8a887f;
  --hair:#e1e0d9; --axis:#c3c2b7; --accent:#2a78d6; --accent-ink:#1c5cab; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --ground:#121211; --surface:#1a1a19; --surface-2:#232321; --ink:#f3f2ea; --ink-2:#c3c2b7; --ink-3:#8a887f;
  --hair:#2c2c2a; --axis:#383835; --accent:#3987e5; --accent-ink:#86b6ef; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --good-ink:#0ca30c;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#256abf; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#121211; --surface:#1a1a19; --surface-2:#232321; --ink:#f3f2ea; --ink-2:#c3c2b7; --ink-3:#8a887f;
  --hair:#2c2c2a; --axis:#383835; --accent:#3987e5; --accent-ink:#86b6ef; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --good-ink:#0ca30c;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#256abf; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;max-width:1440px;margin:0 auto}
nav.toc{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:28px 16px 28px 24px;border-right:1px solid var(--hair);font-size:13px}
nav.toc .brand{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
nav.toc a{display:block;color:var(--ink-2);text-decoration:none;padding:5px 8px;border-left:2px solid transparent;margin-left:-8px}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--ink);border-left-color:var(--axis);outline:none}
nav.toc a.active{color:var(--ink);border-left-color:var(--accent)}
main{padding:28px 40px 80px;min-width:0}
header.masthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--hair)}
header h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
header .sub{color:var(--ink-2);margin-top:6px;max-width:64ch}
.stamp{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;line-height:1.7}
.stamp b{color:var(--ink);font-weight:500}
section{padding-top:40px}
section > h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
section > h2 .num{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-right:10px;font-weight:400;letter-spacing:.06em}
section > p.lede{color:var(--ink-2);max-width:72ch;margin:0 0 18px}
h3{font-size:15px;font-weight:600;margin:26px 0 10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.tile{background:var(--surface);border:1px solid var(--hair);padding:14px 16px 12px;min-width:0}
.tile .v{font-size:28px;font-weight:500;line-height:1.1;margin:6px 0 2px;letter-spacing:-.01em}
.tile .v small{font-size:14px;color:var(--ink-2);font-weight:400;margin-left:2px}
.tile .l{font-size:12.5px;color:var(--ink-2)}
.tile .d{font-family:var(--mono);font-size:11.5px;margin-top:6px;color:var(--ink-3)}
.tile .d.up{color:var(--good-ink)} .tile .d.down{color:var(--crit)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--hair);padding:16px 18px 12px;min-width:0}
.card h4{margin:0;font-size:14px;font-weight:600}
.card .note{font-size:12.5px;color:var(--ink-2);margin:2px 0 10px}
.plot{position:relative;height:250px}
.plot.tall{height:300px}
details.tbl{margin-top:8px;font-size:12.5px}
details.tbl summary{cursor:pointer;color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
details.tbl summary:focus-visible{outline:2px solid var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--hair);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--hair);white-space:nowrap;vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:500;background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:260px;max-width:520px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border:1px solid var(--hair);border-radius:3px;color:var(--ink-2)}
.pill.good{border-color:var(--good);color:var(--good-ink)} .pill.warn{border-color:var(--warn)} .pill.crit{border-color:var(--crit);color:var(--crit)}
.pill.type-feat{border-color:var(--s1)} .pill.type-fix{border-color:var(--s2)} .pill.type-refactor{border-color:var(--s3)} .pill.type-chore{border-color:var(--s4)} .pill.type-ci{border-color:var(--s7)} .pill.type-unclassified{border-style:dashed}
.pill.ext{border-color:var(--s7);color:var(--s7)}
ul.insights{margin:0 0 18px;padding-left:18px;max-width:78ch}
ul.insights li{margin:4px 0}
ul.insights b{font-weight:600}
.heat td.h{text-align:center;font-family:var(--mono);font-size:12px}
.muted{color:var(--ink-3)}
.bench{font-size:12.5px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;align-items:start}
.definitions dt{font-weight:600;margin-top:10px} .definitions dd{margin:2px 0 0;color:var(--ink-2);max-width:78ch}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;margin:10px 0 14px;font-size:13px}
.controls label{display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.controls input{font:inherit;font-family:var(--mono);padding:5px 8px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);width:110px}
.controls input:focus-visible{outline:2px solid var(--accent)}
.status{background:var(--surface);border:1px dashed var(--axis);padding:14px 16px;color:var(--ink-2);max-width:78ch}
.status b{color:var(--ink)}
.banner{margin-top:18px;background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--warn);padding:10px 14px;font-size:13px;color:var(--ink-2)}
.banner.ok{border-left-color:var(--good)}
@media (max-width:900px){.layout{grid-template-columns:1fr}nav.toc{position:static;height:auto;border-right:none;border-bottom:1px solid var(--hair)}main{padding:20px 16px 60px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{nav.toc{display:none}.layout{grid-template-columns:1fr}details.tbl{display:none}}
</style>
</head>
<body>
<div class="layout">
<nav class="toc" aria-label="Sections"><div class="brand" id="brand">project report</div><div id="toc"></div></nav>
<main>
<header class="masthead">
  <div>
    <div class="eyebrow" id="eyebrow">project report</div>
    <h1 id="headline">Delivery, flow and backlog, period by period</h1>
    <div class="sub" id="sub">Everything below comes from this project's own sources, collected once for this report and read as it stood at the cut-off.</div>
  </div>
  <div class="stamp" id="stamp"></div>
</header>
<div id="coverage-banner"></div>
<div id="sections"></div>
</main>
</div>

<script id="report-data" type="application/json">{{{data}}}</script>
<script>{{{chartjs}}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('report-data').textContent);
const M = D.model || {};
const META = D.meta || {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const S = () => ({s:[1,2,3,4,5,6,7,8].map(i=>css('--s'+i)), ink:css('--ink'), ink2:css('--ink-2'), ink3:css('--ink-3'), hair:css('--hair'), axis:css('--axis'), surface:css('--surface'), seq:[1,2,3,4,5,6].map(i=>css('--seq'+i))});
const fmt = (v,dec=0) => v==null||Number.isNaN(v) ? '–' : Number(v).toLocaleString('en-US',{maximumFractionDigits:dec,minimumFractionDigits:0});
const hrs = v => v==null ? '–' : v<1 ? fmt(v*60)+'m' : v<48 ? fmt(v,1)+'h' : fmt(v/24,1)+'d';
const pctf = v => v==null ? '–' : fmt(v,1)+'%';
// Every string that reached this page came from a source or an extension, so
// every one is escaped -- the page never interprets data as markup.
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = id => document.getElementById(id);
const html = s => ({__html:s});
const cellOf = v => v==null ? '–' : (typeof v==='object' && '__html' in v) ? v.__html : typeof v==='number' ? fmt(v, Number.isInteger(v)?0:2) : esc(v);
const HOSTS = new Set(META.linkHosts || []);
// A link only to the report's own source, over https; anything else is text.
function link(url, text){
  try { const u = new URL(String(url)); if (u.protocol==='https:' && HOSTS.has(u.host)) return html(`<a href="${esc(u.href)}" rel="noreferrer noopener">${esc(text)}</a>`); } catch (e) { /* not a URL */ }
  return html(esc(text));
}
const pill = (text, cls='') => html(`<span class="pill ${esc(cls)}">${esc(text)}</span>`);
function table(head, rows, cls=''){
  const numeric = head.map((_,i)=>rows.length>0 && rows.every(r=>r[i]==null||typeof r[i]==='number'||(typeof r[i]==='string'&&/^[-+]?[\d.,]+(%|h|m|d|k)?$/.test(r[i]))));
  return `<table class="${esc(cls)}"><thead><tr>${head.map((x,i)=>`<th class="${numeric[i]?'n':''}">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${numeric[i]?'n':''}${/title/i.test(head[i])?' wrap':''}">${cellOf(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function tile(label, value, unit, opts={}){
  const {delta, better, sub} = opts;
  let d = '';
  if (delta!=null && delta!==0 && isFinite(delta)) d = `<div class="d ${better===true?'up':better===false?'down':''}">${delta>0?'+':''}${esc(fmt(delta,2))}${unit?esc(' '+unit):''} vs baseline</div>`;
  else if (sub) d = `<div class="d">${esc(sub)}</div>`;
  return `<div class="tile"><div class="l">${esc(label)}</div><div class="v">${esc(value)}${unit?`<small>${esc(unit)}</small>`:''}</div>${d}</div>`;
}
const METRICS = new Map((D.metrics||[]).map(m=>[m.id,m]));
const BASE = new Map(((D.baseline||{}).deltas||[]).map(d=>[d.id,d]));
function kpiTile(id, sub){
  const m = METRICS.get(id); if (!m) return '';
  const b = BASE.get(id);
  const unit = m.unit==='hours' ? '' : m.unit==='count' ? '' : m.unit;
  const shown = m.unit==='hours' ? hrs(m.value) : m.unit==='%' ? fmt(m.value,1) : fmt(m.value, m.unit==='per week'?2:0);
  return tile(m.label, shown, m.value==null?'':unit, {delta: b&&b.comparable ? b.delta : null, better: b ? b.better : null, sub: m.value==null ? 'no data in this window' : sub});
}
const periods = M.periods || [];
const periodLabel = p => M.grain==='week' ? 'wk '+p.label.slice(5) : p.label;
const labels = periods.map(p=>periodLabel(p)+(p.partial?'*':''));
const grainWord = {week:'week', iteration:'iteration', cadence:'period'}[M.grain] || 'period';

// ---------- charts: one mk() per chart, each with its table twin ----------
const charts = [];
function mk(id, cfg, twin){
  const c = el(id); if (!c || typeof Chart==='undefined') return;
  const build = () => {
    const t = S(); Chart.defaults.color = t.ink2; Chart.defaults.font.family = css('--sans'); Chart.defaults.font.size = 12;
    const c2 = cfg(t); const o = c2.options || {};
    c2.options = { ...o, responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      plugins:{ legend:{display:c2.data.datasets.length>1, labels:{boxWidth:10, boxHeight:10, color:t.ink2}}, tooltip:{backgroundColor:t.surface, titleColor:t.ink, bodyColor:t.ink2, borderColor:t.axis, borderWidth:1, padding:10}, ...(o.plugins||{}) },
      scales:{ ...(o.scales||{}), x:{grid:{display:false}, border:{color:t.axis}, ticks:{color:t.ink3, maxRotation:0, autoSkip:true}, ...((o.scales||{}).x||{})}, y:{grid:{color:t.hair}, border:{display:false}, ticks:{color:t.ink3, precision:0}, beginAtZero:true, ...((o.scales||{}).y||{})} } };
    c2.data.datasets.forEach(ds=>{
      if (c2.type==='bar' || ds.type==='bar') Object.assign(ds, {borderColor:t.surface, borderWidth:{top:0,bottom:0,left:1,right:1}, borderSkipped:false, maxBarThickness:28});
      if (c2.type==='line' || ds.type==='line') Object.assign(ds, {borderWidth:2, pointRadius:ds.pointRadius ?? 3, pointHoverRadius:6, pointBackgroundColor:ds.borderColor, pointBorderColor:t.surface, pointBorderWidth:1, tension:.15, fill:ds.fill ?? false});
    });
    return new Chart(c, c2);
  };
  let ch = build(); charts.push({rebuild:()=>{ch.destroy(); ch = build();}});
  if (twin) { const det = c.closest('.card').querySelector('details.tbl'); if (det) det.insertAdjacentHTML('beforeend', table(twin.head, twin.rows)); }
}
const bar = (label, data, color, extra={}) => ({label, data, backgroundColor:color, ...extra});
const line = (label, data, color, extra={}) => ({type:'line', label, data, borderColor:color, backgroundColor:color, spanGaps:true, ...extra});
const pctAxis = {y:{max:100, ticks:{callback:v=>v+'%'}}};
const card = (id, title, note, tall=false) => `<div class="card"><h4>${esc(title)}</h4><div class="note">${esc(note)}</div><div class="plot${tall?' tall':''}"><canvas id="${esc(id)}"></canvas></div><details class="tbl"><summary>Table</summary></details></div>`;

// ---------- sections ----------
const R = {};
let number = 0;
function section(id, title, lede){
  number += 1;
  const s = document.createElement('section'); s.id = id;
  s.innerHTML = `<h2><span class="num">${String(number).padStart(2,'0')}</span>${esc(title)}</h2>${lede?`<p class="lede">${esc(lede)}</p>`:''}`;
  el('sections').appendChild(s);
  el('toc').insertAdjacentHTML('beforeend', `<a href="#${esc(id)}">${esc(title)}</a>`);
  return s;
}
const add = (s, markup) => s.insertAdjacentHTML('beforeend', markup);
const statusBox = st => `<div class="status"><b>${st.status==='not-configured'?'Not configured':'Not available'}.</b> ${esc(st.reason || 'the source did not give this data')} ${st.status==='not-configured'?'':' — nothing here is shown as zero.'}</div>`;
const need = (name) => (M.sections||{})[name] || {status:'ok'};
const usable = (name) => need(name).status==='ok' || need(name).status==='complete' || need(name).status==='partial';

R['orbit.report.section.summary'] = (s) => {
  add(s, `<div class="tiles">${[
    kpiTile('orbit.report.kpi.prs-merged', `${fmt((M.kpis||{}).openPrsAtCutoff)} open at the cut-off`),
    kpiTile('orbit.report.kpi.merges-per-week'),
    kpiTile('orbit.report.kpi.items-completed'),
    kpiTile('orbit.report.kpi.backlog-at-cutoff'),
    kpiTile('orbit.report.kpi.cycle-time-median', `p85 ${hrs((M.kpis||{}).p85CycleTimeH)}`),
    kpiTile('orbit.report.kpi.lead-time-median', 'first commit → merge (proxy)'),
    kpiTile('orbit.report.kpi.review-coverage'),
    kpiTile('orbit.report.kpi.pr-size-median'),
    kpiTile('orbit.report.kpi.fix-share'),
    kpiTile('orbit.report.kpi.deployments-per-week'),
  ].join('')}</div>`);
  const notes = [];
  const k = M.kpis || {};
  if (k.prsMerged!=null) notes.push(`<li><b>${fmt(k.prsMerged)} pull requests</b> were merged in the window — ${fmt(k.mergesPerWeek,2)} a week — counted in the ${esc(grainWord)} they were <em>merged</em>, whenever they were opened.</li>`);
  if (k.itemsCompleted!=null) notes.push(`<li><b>${fmt(k.itemsCompleted)} work items</b> were completed and still complete at the cut-off; <b>${fmt(k.backlogAtCutoff)}</b> were open then.</li>`);
  if ((M.flow||{}).unclassifiedPct) notes.push(`<li>${pctf(M.flow.unclassifiedPct)} of merged PRs could not be classified from their title or branch and are shown as <em>unclassified</em>, never as features.</li>`);
  notes.push(`<li>Review numbers count <em>activity</em> — reviews and comments submitted before each merge. They say nothing about the quality of a review or anyone's productivity.</li>`);
  add(s, `<h3>Reading this report</h3><ul class="insights">${notes.join('')}</ul>`);
};

R['orbit.report.section.delivery'] = (s) => {
  if (!periods.length) return add(s, statusBox({status:'missing', reason:'the window has no periods'}));
  add(s, `<div class="grid">${[
    usable('pullRequests') ? card('c-throughput', `Pull requests merged per ${grainWord}, by type of work`, 'Stacked by the type read off the title or branch; unclassified is its own colour.') : '',
    usable('workItems') ? card('c-items', `Work items per ${grainWord}`, 'Completed (and still complete at the cut-off), started, created and canceled.') : '',
    usable('pullRequests') ? card('c-loc', `Lines added and deleted per ${grainWord}`, 'Merged PRs. Generated files and lockfiles are included: change volume, not effort.') : '',
    usable('pullRequests') ? card('c-wipsprint', `Open PRs at the end of each ${grainWord}`, 'Open at the earlier of the period end and the cut-off, beside PRs opened in the period.') : '',
  ].join('')}</div>`);
  const TYPES = ['feat','fix','refactor','chore','docs','ci','perf','test','unclassified'];
  mk('c-throughput', t=>({type:'bar', data:{labels, datasets:TYPES.map((ty,i)=>bar(ty, periods.map(p=>p.workTypes[ty]||0), ty==='unclassified'?t.axis:t.s[i%8]))}, options:{scales:{x:{stacked:true}, y:{stacked:true}}}}),
    {head:['Period',...TYPES,'Merged','Opened'], rows:periods.map(p=>[p.label+(p.partial?' (partial)':''),...TYPES.map(ty=>p.workTypes[ty]||0),p.prsMerged,p.prsOpened])});
  mk('c-items', t=>({type:'bar', data:{labels, datasets:[bar('completed', periods.map(p=>p.itemsCompleted), t.s[2]), bar('started', periods.map(p=>p.itemsStarted), t.s[0]), bar('created', periods.map(p=>p.itemsCreated), t.s[3]), bar('canceled', periods.map(p=>p.itemsCanceled), t.s[7])]}}),
    {head:['Period','Completed','Started','Created','Canceled','Bugs completed'], rows:periods.map(p=>[p.label,p.itemsCompleted,p.itemsStarted,p.itemsCreated,p.itemsCanceled,p.bugsCompleted])});
  mk('c-loc', t=>({type:'bar', data:{labels, datasets:[bar('added', periods.map(p=>p.additions), t.s[0]), bar('deleted', periods.map(p=>p.deletions), t.s[1])]}, options:{scales:{y:{ticks:{callback:v=>fmt(v/1000,1)+'k'}}}}}),
    {head:['Period','Added','Deleted','Files','Commits'], rows:periods.map(p=>[p.label,p.additions,p.deletions,p.filesChanged,p.commits])});
  mk('c-wipsprint', t=>({type:'bar', data:{labels, datasets:[bar('open at end', periods.map(p=>p.wipAtEnd), t.s[0]), bar('opened', periods.map(p=>p.prsOpened), t.s[3])]}}),
    {head:['Period','Open at end','Opened','Merged','Closed unmerged'], rows:periods.map(p=>[p.label,p.wipAtEnd,p.prsOpened,p.prsMerged,p.prsClosedUnmerged])});
  add(s, `<h3>Scorecard per ${esc(grainWord)}</h3><div class="tablewrap">${table(['Period','Dates','Merged','Opened','Open at end','Items done','Median size','Median cycle','p85 cycle','Pickup','Human review %','Fix %','People'],

R['orbit.report.section.forecast'] = (s) => {
  const F = D.forecast;
  if (!F) return add(s, statusBox({status:'missing', reason:'the forecast part did not run'}));
  const b = F.basis || {};
  if (F.status!=='ok') { add(s, `<div class="status"><b>No forecast.</b> ${esc(F.reason)}</div>`); if (b.samples) add(s, `<p class="bench">Samples in this window (${esc(b.unit||'')} per complete ${esc(grainWord)}): ${esc(b.samples.join(', ')||'none')}.</p>`); return; }
  const lvl = (k) => F[k].beyondHorizon ? `beyond the horizon (${fmt(F.horizon)} ${grainWord}s)` : `${fmt(F[k].periods)} ${grainWord}s · ${esc(F[k].endsOn)}`;
  add(s, `<p class="lede">A throughput Monte Carlo: draw one complete ${esc(grainWord)}'s ${esc(b.unit)} at random from this window, repeat until the remaining work is covered, ${fmt(F.runs)} times. Dates count from the cut-off (${esc((META.window||{}).cutoff||'')}).</p>`);
  add(s, `<div class="tablewrap">${table(['Confidence','Finished by'], [['50%',html(lvl('p50'))],['85%',html(lvl('p85'))],['95%',html(lvl('p95'))]])}</div>`);
  add(s, `<p class="bench">Remaining: ${fmt(b.remaining,1)} ${esc(b.remainingUnit||'items')}${b.prsPerStory?` × ${fmt(b.prsPerStory,1)} feature PRs per story (an assumption)`:''} = ${fmt(F.need,1)}. Samples (${fmt(b.sampleCount)}): ${esc((b.samples||[]).join(', '))}. ${fmt(F.completedWithinHorizonPct,1)}% of runs finished within the horizon. Model ${esc(F.model)}, seed ${esc(F.seed)}.</p><ul class="insights">${(b.assumptions||[]).map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`);
  add(s, `<div class="card"><h4>Calculator</h4><div class="controls"><label>Remaining ${esc(b.remainingUnit||'items')} <input id="fc-items" type="number" min="0" step="1" value="${esc(b.remaining)}"></label>${b.prsPerStory?`<label>Feature PRs per story <input id="fc-ppi" type="number" min="0.1" step="0.1" value="${esc(b.prsPerStory)}"></label>`:''}<label>Team scale <input id="fc-scale" type="number" min="0.1" step="0.1" value="1"></label></div><div class="tablewrap" id="t-calc"></div><p class="bench">Same rule as above: the same samples, and no answer when there are none.</p></div>`);
  const samples = b.samples || [];
  const calc = () => {
    const need = (+el('fc-items').value||0) * (el('fc-ppi') ? (+el('fc-ppi').value||1) : 1), scale = +el('fc-scale').value||1;
    const tp = samples.map(v=>v*scale);
    if (!tp.length || !tp.some(v=>v>0)) { el('t-calc').innerHTML = '<p class="bench" style="padding:8px 10px;margin:0">No throughput to sample.</p>'; return; }
    let seed = (F.seed>>>0)||1; const rnd = () => (seed = (Math.imul(seed,1664525)+1013904223)>>>0)/4294967296;
    const N = 4000, H = F.horizon, res = [];
    for (let i=0;i<N;i++){ let d=0,n=0; while(d<need && n<H){ d+=tp[Math.floor(rnd()*tp.length)]; n++; } res.push(d>=need?n:Infinity); }
    res.sort((a,x)=>a-x); const q = p => res[Math.floor(p*(N-1))];
    el('t-calc').innerHTML = table(['Confidence',`${grainWord}s needed`], [['50%',q(.5)===Infinity?'beyond horizon':q(.5)],['85%',q(.85)===Infinity?'beyond horizon':q(.85)],['95%',q(.95)===Infinity?'beyond horizon':q(.95)]]);
  };
  ['fc-items','fc-ppi','fc-scale'].forEach(id=>el(id)&&el(id).addEventListener('input', calc)); calc();
};

R['orbit.report.section.baseline'] = (s) => {
  const B = D.baseline;
  if (!B || B.status==='none') return add(s, `<div class="status"><b>No baseline yet.</b> ${esc((B&&B.reason)||'This is the first report of this scope and window; the next comparable one will compare against it.')}</div>`);
  if (B.status==='not-comparable') return add(s, `<div class="status"><b>Not comparable.</b> ${esc(B.reason)}</div>`);
  add(s, `<p class="lede">Compared with run ${esc(B.previous.runId)} (${esc(B.previous.from)} → ${esc(B.previous.to)}): same source, scope, window length and metric versions. Only rates, shares and medians are compared; totals are shown side by side.</p>`);
  add(s, `<div class="tablewrap">${table(['Metric','Previous','Current','Change','Reading'], B.deltas.map(d=>[d.label, d.unit==='hours'?hrs(d.previous):fmt(d.previous,1), d.unit==='hours'?hrs(d.current):fmt(d.current,1), d.comparable?(d.delta>0?'+':'')+fmt(d.delta,1):'–', d.comparable?(d.better==null?pill('changed'):pill(d.better?'better':'worse', d.better?'good':'crit')):pill('total — not compared')]))}</div>`);
};

R['extension'] = (s, x) => {
  add(s, `<p class="bench"><span class="pill ext">extension</span> ${esc(x.part)} ${esc(x.version)} · from ${esc(x.source)}${x.createdFor?` · made for: ${esc(x.createdFor)}`:''}</p>`);
  if (x.status!=='ok') return add(s, `<div class="status"><b>${x.status==='unavailable'?'Not available':'This part failed'}.</b> ${esc(x.error || (x.notes||[]).join(' ') || 'no reason given')} The rest of the report is unaffected.</div>`);
  (x.blocks||[]).forEach((blk, i) => add(s, block(blk, `${x.id}-${i}`)));
  (x.metrics||[]).forEach(m => add(s, `<p class="bench"><b>${esc(m.label)}</b> (${esc(m.unit)}, v${esc(m.version)}): ${esc(m.definition)}</p>`));
};

function block(b, key){
  if (b.type==='tiles') return `${b.title?`<h3>${esc(b.title)}</h3>`:''}<div class="tiles">${(b.items||[]).map(t=>tile(t.label, typeof t.value==='number'?fmt(t.value,2):String(t.value??'–'), t.unit||'', {sub:t.note})).join('')}</div>`;
  if (b.type==='table') return `${b.title?`<h3>${esc(b.title)}</h3>`:''}<div class="tablewrap">${table(b.columns||[], (b.rows||[]).map(r=>r.map(v=>v&&typeof v==='object'&&v.url?link(v.url, v.text||v.url):v)))}</div>`;
  if (b.type==='text') return `${b.title?`<h3>${esc(b.title)}</h3>`:''}<p class="bench">${esc(b.body)}</p>`;
  if (b.type==='notes') return `${b.title?`<h3>${esc(b.title)}</h3>`:''}<ul class="insights">${(b.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
  if (b.type==='chart') { const id = 'x-'+key.replace(/[^a-z0-9-]/gi,''); queueMicrotask(()=>mk(id, t=>({type:b.kind==='line'?'line':'bar', data:{labels:b.labels||[], datasets:(b.series||[]).map((se,i)=>(b.kind==='line'?line:bar)(String(se.name), se.values||[], t.s[i%8]))}, options:b.stacked?{scales:{x:{stacked:true}, y:{stacked:true}}}:{}}), {head:['', ...(b.series||[]).map(se=>String(se.name))], rows:(b.labels||[]).map((l,i)=>[String(l), ...(b.series||[]).map(se=>(se.values||[])[i])])})); return `<div class="grid">${card(id, b.title||'', b.unit?`in ${b.unit}`:'')}</div>`; }
  return '';
}

R['orbit.report.section.coverage'] = (s) => {
  const C = D.coverage || {};
  add(s, `<h3>Source and scope</h3><div class="tablewrap">${table(['What','Value'], [['Provider', META.providerLabel||META.provider], ['Organization', META.organization||'–'], ['Scope', (META.scope||[]).join(', ')||'–'], ['Window', `${(META.window||{}).from||'start of history'} → ${(META.window||{}).to} (${(META.window||{}).tz})${(META.window||{}).partial?' — to date':''}`], ['Cut-off', `${(META.window||{}).cutoff} (end of day, ${(META.window||{}).tz})`], ['Collected', `${META.collectedStarted||'–'} → ${META.collectedFinished||'–'}`], ['Run', `${META.runId} · render ${META.render}`], ['Engine', `${META.engine||'–'} · kit ${META.kit||'–'}`]])}</div>`);
  add(s, `<h3>What was collected</h3><div class="tablewrap">${table(['Collection','Status','Items','Pages','Reason / note'], (C.collections||[]).map(c=>[c.name, pill(c.status, c.status==='complete'?'good':c.status==='partial'?'warn':c.status==='not-configured'?'':'crit'), c.items, c.pages, [c.reason, (c.truncated||[]).length?`truncated: ${c.truncated.join(', ')}`:''].filter(Boolean).join(' · ')]))}</div>`);
  add(s, `<h3>What computed and rendered it</h3><div class="tablewrap">${table(['Part','Kind','Version','Source','Status','SHA-256','Time','Error'], (C.parts||[]).map(p=>[p.id,p.kind,p.version,p.source,pill(p.status, p.status==='ok'?'good':p.status==='unavailable'?'warn':'crit'),(p.sha256||'').slice(0,12),p.ms!=null?fmt(p.ms)+' ms':'–',p.error||'']))}</div>`);
  if ((C.skipped||[]).length) add(s, `<h3>Parts not run</h3><div class="tablewrap">${table(['Part','Why'], C.skipped.map(p=>[p.id,p.why]))}</div>`);
  if ((C.drafts||[]).length) add(s, `<h3>Extension drafts not run</h3><div class="tablewrap">${table(['Draft','Why'], C.drafts.map(d=>[d.id,d.why]))}</div>`);
  const limits = [...(C.notes||[]), 'Pull-request timestamps are elapsed calendar time; a PR opened on Friday and merged on Monday reads as three days.', 'Review-thread resolution is only known as the source shows it now, so it is reported "at capture", never "at merge".', 'Parts run as the local user on this machine; the guard around them is a second lock, not a sandbox.'];
  add(s, `<h3>Limits of this report</h3><ul class="insights">${limits.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`);
};

R['orbit.report.section.definitions'] = (s) => {
  add(s, `<dl class="definitions">${(D.definitions||[]).map(d=>`<dt>${esc(d.label)} <span class="muted">(${esc(d.unit)}, v${esc(d.version)}${d.source!=='builtin'?', '+esc(d.source):''})</span></dt><dd>${esc(d.definition)}</dd>`).join('')}</dl>`);
};

R['orbit.report.section.appendix'] = (s) => {
  const rows = M.prTable || [];
  if (rows.length) {
    add(s, `<h3>Pull requests (${rows.length})</h3><div class="controls"><label>Filter (number, title, author, type, repository) <input id="pr-filter" type="search" style="width:320px" placeholder="e.g. fix portal-web"></label></div><div class="tablewrap" id="t-prs" style="max-height:70vh;overflow:auto"></div>`);
    const draw = q => { q = (q||'').toLowerCase().trim(); const f = rows.filter(r=>!q || `${r.number} ${r.title} ${r.author} ${r.workType} ${r.repo} ${r.state}`.toLowerCase().includes(q));
      el('t-prs').innerHTML = table(['PR','Title','Repository','Author','State','Type','Size','Lines','Commits','AI commits','Human rev.','Bot rev.','Unresolved at capture','Pickup','Cycle','Lead','Created','Merged'], f.map(r=>[link(r.url,'#'+r.number),r.title,r.repo,r.author,r.state,pill(r.workType,'type-'+r.workType),r.sizeBucket,r.linesChanged,r.commits,r.aiCommits,r.humanReviews,r.botReviews,r.unresolvedAtCapture,hrs(r.hoursPickup),hrs(r.hoursCycle),hrs(r.hoursLead),r.created,r.merged||'–'])) + `<p class="bench" style="padding:8px 10px;margin:0">${f.length} of ${rows.length}</p>`; };
    draw(''); el('pr-filter').addEventListener('input', e=>draw(e.target.value));
  }
  const items = M.itemTable || [];
  if (items.length) add(s, `<h3>Work items (${items.length})</h3><div class="tablewrap" style="max-height:60vh;overflow:auto">${table(['Item','Title','Type','State','Category','Created','Done','Reopened','Cycle','Age (days)'], items.map(i=>[link(i.url,i.key),i.title,i.type,i.state,i.category,i.created,i.done||'–',i.reopened,hrs(i.hoursCycle),i.ageDays]))}</div>`);
};

// ---------- header ----------
(function(){
  const w = META.window || {};
  document.title = `${META.project||'Project'} · project report ${w.from||''} → ${w.to||''}`;
  el('brand').textContent = `${META.project||''} · project report`;
  el('eyebrow').textContent = `${META.providerLabel||''} · ${(META.scope||[]).join(', ')}`;
  el('headline').textContent = `${META.project||'Project'}: ${w.from||'all history'} → ${w.to||''}`;
  el('stamp').innerHTML = `window <b>${esc(w.from||'start')}</b> → <b>${esc(w.to)}</b>${w.partial?' (to date)':''}<br>cut-off <b>${esc(w.cutoff)}</b> · ${esc(w.tz)}<br>run ${esc(META.runId)} · generated ${esc((META.generatedAt||'').slice(0,16).replace('T',' '))} UTC`;
  const gaps = ((D.coverage||{}).collections||[]).filter(c=>c.status!=='complete' && c.status!=='not-configured');
  const failed = ((D.coverage||{}).parts||[]).filter(p=>p.status==='failed');
  el('coverage-banner').innerHTML = gaps.length||failed.length ? `<div class="banner"><b>Partial report.</b> ${gaps.map(g=>`${esc(g.name)}: ${esc(g.status)}${g.reason?' — '+esc(g.reason):''}`).join('; ')}${failed.length?`${gaps.length?'; ':''}failed parts: ${failed.map(p=>esc(p.id)).join(', ')}`:''}. See <a href="#orbit.report.section.coverage">Data coverage &amp; method</a>.</div>` : `<div class="banner ok">Every configured collection was read completely for this window.</div>`;
})();

// ---------- render every enabled section, in order ----------
// A standard section drawn from a model that was never made says so, once,
// in its own words -- never a page of zeros.
const WITHOUT_MODEL = new Set(['orbit.report.section.coverage','orbit.report.section.definitions']);
for (const sec of (D.sections||[])) {
  if (!sec.enabled) continue;
  const s = section(sec.id, sec.title, sec.lede);
  if (!sec.extension && META.modelProblem && !WITHOUT_MODEL.has(sec.id)) { add(s, statusBox({status:'missing', reason: META.modelProblem})); continue; }
  try { (sec.extension ? R['extension'] : R[sec.id]) && (sec.extension ? R['extension'](s, sec.extension) : R[sec.id](s)); }
  catch (e) { add(s, `<div class="status"><b>This section could not be drawn.</b> ${esc(e.message)}</div>`); }
}

// ---------- theme + nav ----------
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>charts.forEach(c=>c.rebuild()));
new MutationObserver(()=>charts.forEach(c=>c.rebuild())).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>charts.forEach(c=>c.rebuild()));
const links=[...document.querySelectorAll('nav.toc a')];
const io = new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.classList.toggle('active', l.getAttribute('href')==='#'+e.target.id)); }});},{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));
</script>
</body>
</html>
